<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>事業者ログイン | ふるさと納税 返礼品管理ポータル</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>返礼品管理ポータル</h1>
      <p class="sub">塩尻市 事業者向け（試験導入）</p>

      <form id="login-form">
        <label for="operatorId">事業者ID</label>
        <input type="text" id="operatorId" autocomplete="username" inputmode="latin" required />

        <label for="password">パスワード</label>
        <input type="password" id="password" autocomplete="current-password" required />

        <button type="submit" class="btn-primary" id="submit-btn">ログイン</button>
        <div class="error-msg" id="error-msg"></div>
      </form>

      <a href="/admin.html" style="display:block;text-align:center;margin-top:22px;font-size:12px;color:#6b7570;">
        自治体担当者の方はこちら（管理画面）
      </a>
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
